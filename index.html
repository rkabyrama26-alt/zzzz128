<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأفلام والمسلسلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent: #e50914;
            --accent-hover: #ff1a2e;
            --gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .tab-btn:hover:not(.active) { color: white; }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-right: 48px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus { border-color: var(--accent); }

        .search-box::before {
            content: '🔍';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        /* Stats Bar */
        .stats-bar {
            padding: 12px 24px;
            background: var(--bg-secondary);
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .stats-bar span { color: var(--gold); font-weight: 700; }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 24px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--accent);
        }

        .card-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--bg-secondary);
            display: block;
        }

        .card-poster-placeholder {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--text-secondary);
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .card-rating {
            color: var(--gold);
            font-weight: 700;
        }

        .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 2;
        }

        /* Loader */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Modal / Player */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .modal-close:hover { background: var(--accent); }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px 20px 0 0;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
        }

        .modal-info {
            padding: 24px;
        }

        .modal-info h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .modal-info .meta {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .modal-info p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
        }

        /* Error State */
        .error-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
        }

        .error-box h3 { color: var(--accent); margin-bottom: 12px; }
        .error-box p { color: var(--text-secondary); font-size: 14px; }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .tabs { order: 3; width: 100%; }
            .tab-btn { flex: 1; text-align: center; }
            .search-box { max-width: none; order: 2; width: 100%; }
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                padding: 16px;
            }
            .logo { font-size: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 سينما IPTV</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-type="movies" onclick="switchTab('movies')">🎥 أفلام</button>
            <button class="tab-btn" data-type="series" onclick="switchTab('series')">📺 مسلسلات</button>
        </div>
    </header>

    <div class="stats-bar">
        <div>الأفلام: <span id="movieCount">0</span></div>
        <div>المسلسلات: <span id="seriesCount">0</span></div>
        <div>يتم عرض: <span id="visibleCount">0</span></div>
    </div>

    <div class="content-grid" id="contentGrid">
        <div class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">جاري تحميل المحتوى...</div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="video-container" id="videoContainer"></div>
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <div class="meta" id="modalMeta"></div>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script>
        // ====== إعدادات السيرفر ======
        const SERVER_URL = 'http://clsmarview.club:2082';
        const USERNAME = '17954823';
        const PASSWORD = '91459788';
        const API_URL = `${SERVER_URL}/player_api.php?username=${USERNAME}&password=${PASSWORD}`;

        // ====== الحالة العامة ======
        let allMovies = [];
        let allSeries = [];
        let currentTab = 'movies';
        let searchTerm = '';
        
        // ====== متغيرات التمرير اللانهائي (Infinite Scroll) ======
        let currentPage = 1;
        const itemsPerPage = 10; // عرض أول 10 عناصر ثم التحميل التدريجي
        let isLoading = false;
        let hasMore = true;

        // ====== عناصر DOM ======
        const grid = document.getElementById('contentGrid');
        const searchInput = document.getElementById('searchInput');
        const movieCountEl = document.getElementById('movieCount');
        const seriesCountEl = document.getElementById('seriesCount');
        const visibleCountEl = document.getElementById('visibleCount');

        // ====== مراقب التقاطع للتمرير اللانهائي ======
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && hasMore && !isLoading) {
                    isLoading = true;
                    currentPage++;
                    render(true);
                    isLoading = false;
                }
            });
        }, { root: null, rootMargin: '200px', threshold: 0.1 });

        function observeLoader() {
            const loader = document.getElementById('scroll-loader');
            if (loader) {
                scrollObserver.observe(loader);
            }
        }

        // ====== دوال مساعدة ======
        function getPosterUrl(item) {
            const possibleFields = ['stream_icon', 'cover', 'cover_big', 'movie_image', 'thumbnail'];
            for (const field of possibleFields) {
                if (item[field] && typeof item[field] === 'string' && item[field].startsWith('http')) {
                    return item[field];
                }
            }
            return null;
        }

        function getRating(item) {
            return item.rating || item.rating_5based || item.vote_average || null;
        }

        function getYear(item) {
            return item.year || (item.releaseDate ? item.releaseDate.split('-')[0] : null) || item.release_date || null;
        }

        // ====== جلب البيانات ======
        async function fetchData() {
            try {
                const moviesRes = await fetch(`${API_URL}&action=get_vod_streams`);
                if (moviesRes.ok) {
                    const moviesData = await moviesRes.json();
                    if (Array.isArray(moviesData)) {
                        allMovies = moviesData;
                    }
                }

                const seriesRes = await fetch(`${API_URL}&action=get_series`);
                if (seriesRes.ok) {
                    const seriesData = await seriesRes.json();
                    if (Array.isArray(seriesData)) {
                        allSeries = seriesData;
                    }
                }

                movieCountEl.textContent = allMovies.length;
                seriesCountEl.textContent = allSeries.length;

                if (allMovies.length === 0 && allSeries.length === 0) {
                    showError('لم يتم العثور على محتوى. تأكد من صحة بيانات الاتصال أو أن السيرفر يدعم Xtream Codes API.');
                    return;
                }

                render(false);
            } catch (err) {
                console.error('خطأ في الجلب:', err);
                showError('حدث خطأ في الاتصال بالسيرفر. قد يكون السبب هو حظر CORS من المتصفح. جرب استخدام إضافة مثل "CORS Unblock" أو قم بتشغيل الصفحة عبر سيرفر محلي.');
            }
        }

        // ====== عرض المحتوى ======
        function render(append = false) {
            let items = currentTab === 'movies' ? allMovies : allSeries;

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                items = items.filter(item => {
                    const name = (item.name || item.title || '').toLowerCase();
                    return name.includes(term);
                });
            }

            const totalItems = items.length;
            const maxItems = currentPage * itemsPerPage;
            hasMore = maxItems < totalItems;
            
            const startIndex = append ? (currentPage - 1) * itemsPerPage : 0;
            const itemsToRender = items.slice(startIndex, maxItems);
            
            visibleCountEl.textContent = Math.min(maxItems, totalItems);

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="error-box">
                        <h3>لا توجد نتائج</h3>
                        <p>لم يتم العثور على عناصر تطابق بحثك أو أن هذه الفئة فارغة.</p>
                    </div>`;
                return;
            }

            const html = itemsToRender.map((item, index) => {
                const absoluteIndex = startIndex + index;
                const name = item.name || item.title || 'بدون عنوان';
                const poster = getPosterUrl(item);
                const rating = getRating(item);
                const year = getYear(item);
                const isSeries = currentTab === 'series';

                return `
                    <div class="card" onclick="openPlayer('${currentTab}', ${absoluteIndex})">
                        ${isSeries ? '<div class="card-badge">مسلسل</div>' : ''}
                        ${poster
                            ? `<img class="card-poster" src="${poster}" alt="${name}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'card-poster-placeholder\\'>🎬</div>'">`
                            : `<div class="card-poster-placeholder">🎬</div>`
                        }
                        <div class="card-info">
                            <div class="card-title">${name}</div>
                            <div class="card-meta">
                                <span>${year || ''}</span>
                                ${rating ? `<span class="card-rating">⭐ ${parseFloat(rating).toFixed(1)}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            }).join('');

            if (append) {
                const existingLoader = document.getElementById('scroll-loader');
                if (existingLoader) {
                    scrollObserver.unobserve(existingLoader);
                    existingLoader.remove();
                }
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                while (tempDiv.firstChild) {
                    grid.appendChild(tempDiv.firstChild);
                }
            } else {
                grid.innerHTML = html;
            }

            if (hasMore) {
                const loaderDiv = document.createElement('div');
                loaderDiv.id = 'scroll-loader';
                loaderDiv.className = 'loader-container';
                loaderDiv.style.padding = '40px 20px';
                loaderDiv.innerHTML = '<div class="spinner"></div><div class="loader-text">جاري تحميل المزيد...</div>';
                grid.appendChild(loaderDiv);
                setTimeout(observeLoader, 0);
            }
        }

        // ====== التبديل بين التبويبات ======
        function switchTab(type) {
            currentTab = type;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            currentPage = 1;
            hasMore = true;
            render(false);
        }

        // ====== البحث ======
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value.trim();
            currentPage = 1;
            hasMore = true;
            render(false);
        });

        // ====== فتح المشغل ======
        function openPlayer(type, index) {
            let items = type === 'movies' ? allMovies : allSeries;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                items = items.filter(item => {
                    const name = (item.name || item.title || '').toLowerCase();
                    return name.includes(term);
                });
            }
            
            const item = items[index];
            if (!item) return;

            const name = item.name || item.title || 'بدون عنوان';
            const rating = getRating(item);
            const year = getYear(item);
            const desc = item.plot || item.description || item.overview || 'لا يوجد وصف متاح.';

            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalMeta').innerHTML =
                `${type === 'movies' ? '🎥 فيلم' : '📺 مسلسل'} ${year ? '• ' + year : ''} ${rating ? '• ⭐ ' + parseFloat(rating).toFixed(1) : ''}`;
            document.getElementById('modalDesc').textContent = desc;

            const videoContainer = document.getElementById('videoContainer');
            let streamUrl = '';

            if (type === 'movies') {
                const ext = item.container_extension || 'mp4';
                const streamId = item.stream_id || item.id;
                streamUrl = `${SERVER_URL}/movie/${USERNAME}/${PASSWORD}/${streamId}.${ext}`;
            } else {
                videoContainer.innerHTML = '<div style="color:#a0a0b0;padding:40px;text-align:center;">جاري تحميل الحلقات...</div>';
                document.getElementById('modalOverlay').classList.add('active');
                loadSeriesEpisodes(item.series_id || item.id);
                return;
            }

            videoContainer.innerHTML = `
                <video controls autoplay playsinline>
                    <source src="${streamUrl}" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>`;

            document.getElementById('modalOverlay').classList.add('active');
        }

        // ====== جلب حلقات المسلسل ======
        async function loadSeriesEpisodes(seriesId) {
            const videoContainer = document.getElementById('videoContainer');
            try {
                const res = await fetch(`${API_URL}&action=get_series_info&series_id=${seriesId}`);
                if (!res.ok) throw new Error('فشل الجلب');
                const data = await res.json();

                const episodes = data.episodes;
                if (!episodes || Object.keys(episodes).length === 0) {
                    videoContainer.innerHTML = '<div style="color:#a0a0b0;padding:40px;text-align:center;">لا توجد حلقات متاحة لهذا المسلسل.</div>';
                    return;
                }

                let allEpisodes = [];
                for (const season in episodes) {
                    if (Array.isArray(episodes[season])) {
                        episodes[season].forEach(ep => {
                            allEpisodes.push({ ...ep, season });
                        });
                    }
                }

                if (allEpisodes.length === 0) {
                    videoContainer.innerHTML = '<div style="color:#a0a0b0;padding:40px;text-align:center;">لا توجد حلقات متاحة.</div>';
                    return;
                }

                let html = '<div style="padding:20px;max-height:60vh;overflow-y:auto;width:100%;">';
                html += '<h3 style="margin-bottom:16px;color:#d4af37;">الحلقات المتاحة</h3>';
                allEpisodes.forEach((ep, i) => {
                    const epNum = ep.episode_num || ep.episode || i + 1;
                    const epTitle = ep.title || `الحلقة ${epNum}`;
                    const ext = ep.container_extension || 'mp4';
                    const epId = ep.id || ep.stream_id;
                    const epUrl = `${SERVER_URL}/series/${USERNAME}/${PASSWORD}/${epId}.${ext}`;
                    html += `
                        <div style="padding:12px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;cursor:pointer;"
                             onclick="playEpisode('${epUrl}')">
                            <span>${epTitle}</span>
                            <span style="color:var(--accent);font-size:13px;">▶ تشغيل</span>
                        </div>`;
                });
                html += '</div>';
                videoContainer.innerHTML = html;

            } catch (err) {
                console.error('خطأ في جلب الحلقات:', err);
                videoContainer.innerHTML = '<div style="color:#a0a0b0;padding:40px;text-align:center;">تعذر تحميل الحلقات.</div>';
            }
        }

        // ====== تشغيل حلقة ======
        function playEpisode(url) {
            const videoContainer = document.getElementById('videoContainer');
            videoContainer.innerHTML = `
                <video controls autoplay playsinline>
                    <source src="${url}" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>`;
        }

        // ====== إغلاق النافذة المنبثقة ======
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            const video = document.querySelector('#videoContainer video');
            if (video) video.pause();
            document.getElementById('videoContainer').innerHTML = '';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ====== عرض رسالة خطأ ======
        function showError(msg) {
            grid.innerHTML = `
                <div class="error-box">
                    <h3>⚠️ خطأ</h3>
                    <p>${msg}</p>
                </div>`;
        }

        // ====== بدء التطبيق ======
        fetchData();
    </script>
</body>
</html>
